name: F.N.B. Corporation
kind: company
description: >-
  F.N.B. Corporation (NYSE: FNB) is a diversified financial services holding
  company headquartered in Pittsburgh, Pennsylvania, and the parent of First
  National Bank of Pennsylvania, an FDIC-insured, state-chartered commercial
  bank. With roughly $50 billion in total assets at year-end 2025, FNB is a
  regional super-community bank operating around 350 branches across seven
  states and Washington, D.C. (Pennsylvania, Ohio, Maryland, West Virginia,
  North Carolina, South Carolina and Virginia), offering commercial banking,
  consumer banking and wealth management through its eStore digital platform.
  On open finance, FNB exposes NO first-party public developer portal or
  documented API: the developer/api subdomains of fnb-online.com redirect to
  the marketing homepage and no developer documentation is published.
  Consumer-permissioned account and transaction data is reachable only through
  third-party aggregators (notably Plaid), not a first-party FNB API. No direct
  Financial Data Exchange (FDX) membership or public CFPB Section 1033 posture
  is documented by the institution as of this profile.
